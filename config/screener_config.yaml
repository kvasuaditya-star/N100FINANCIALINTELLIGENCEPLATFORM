presets:
  quality_compounder:
    name: "Quality Compounder"
    description: "High ROE, low debt, consistent growth."
    filters:
      roe_min: 15.0
      de_max: 1.0
      fcf_min: 0.0
      revenue_cagr_5yr_min: 10.0

  value_pick:
    name: "Value Pick"
    description: "Undervalued stocks with decent dividends."
    filters:
      pe_max: 20.0
      pb_max: 3.0
      de_max: 2.0
      dividend_yield_min: 1.0

  growth_accelerator:
    name: "Growth Accelerator"
    description: "High top-line and bottom-line growth."
    filters:
      pat_cagr_5yr_min: 20.0
      revenue_cagr_5yr_min: 15.0
      de_max: 2.0

  dividend_champion:
    name: "Dividend Champion"
    description: "Strong dividend payers with healthy payouts."
    filters:
      dividend_yield_min: 2.0
      dividend_payout_max: 80.0
      fcf_min: 0.0

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    description: "Zero debt, large cap, consistent performers."
    filters:
      de_max: 0.0
      roe_min: 12.0
      sales_min: 5000.0

  turnaround_watch:
    name: "Turnaround Watch"
    description: "Recent growth, cash generation, and deleveraging."
    filters:
      revenue_cagr_3yr_min: 10.0
      fcf_min: 0.0
      de_declining: true
